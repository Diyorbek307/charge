<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charge</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
    }
    .logo {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Charge</h1>
    <p>Проект успешно запущен и работает на Render.<br />Скоро здесь появится настоящее приложение.</p>
    <div class="badge">🟢 Деплой работает</div>
  </div>
</body>
</html>
