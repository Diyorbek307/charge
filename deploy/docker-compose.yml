# Self-hosted production stack: app + Postgres + Caddy (automatic HTTPS).
#
#   cp deploy/.env.example deploy/.env    # fill in the values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Caddy obtains and renews the Let's Encrypt certificate for $DOMAIN by itself;
# point the domain's A record at this server and open ports 80 and 443.

services:
  app:
    build:
      context: ..
      args:
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://charge:${POSTGRES_PASSWORD}@db:5432/charge?sslmode=disable
      PUBLIC_URL: https://${DOMAIN}
      DEMO_MODE: ${DEMO_MODE:-false}
      OCPP_PASSWORD: ${OCPP_PASSWORD}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_TEST: ${PAYME_TEST:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: charge
      POSTGRES_DB: charge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charge -d charge"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly database dump, kept for 14 days in the `backups` volume.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U charge charge | gzip > /backups/charge-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
